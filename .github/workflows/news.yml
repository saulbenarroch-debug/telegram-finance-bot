name: Noticias financieras

on:
  # El disparo puntual lo hace un servicio externo (cron-job.org) que llama a
  # GitHub via workflow_dispatch a las 10:00 y 16:00 hora Venezuela.
  # Ya no se usa "schedule" de GitHub porque llegaba con retrasos.
  workflow_dispatch:

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar resumen a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
