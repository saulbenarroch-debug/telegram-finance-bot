name: Entorno en Vinetas

on:
  # A PEDIDO, no por horario: lo dispara el propio bot de Telegram cuando
  # alguien escribe "/entorno" o "dame el entorno en vinetas". El Worker manda
  # el texto al instante y lanza este workflow con el chat que lo pidio, que es
  # a donde vuelven las laminas.
  workflow_dispatch:
    inputs:
      chat:
        description: "Chat de Telegram al que enviar las laminas (vacio = todos los de CHAT_ID)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: entorno
  cancel-in-progress: false

jobs:
  laminas:
    runs-on: ubuntu-latest
    env:
      TZ: America/Caracas
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El runner de ubuntu ya trae Google Chrome, que es lo que convierte el
      # HTML en PNG. No hay que instalar nada mas.
      - name: Verificar Chrome
        run: google-chrome --version

      - name: Generar laminas
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CHROME_BIN: google-chrome
        run: python entorno/render.py

      - name: Enviar por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # Si el bot paso un chat, van solo a ese; si se dispara a mano desde
          # la pestana Actions, van a todos los destinatarios de siempre.
          CHAT_ID: ${{ inputs.chat != '' && inputs.chat || secrets.CHAT_ID }}
        run: python entorno/send_telegram.py

      - name: Guardar laminas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entorno-laminas
          path: entorno/out/**
          retention-days: 30
          if-no-files-found: ignore
