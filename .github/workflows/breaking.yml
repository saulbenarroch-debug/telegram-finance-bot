name: Alertas de alto impacto

on:
  # El disparo puntual lo hace un servicio externo (cron-job.org) que llama a
  # GitHub via workflow_dispatch cada hora. Ya no se usa "schedule" de GitHub.
  workflow_dispatch:

permissions:
  contents: write           # necesario para guardar breaking_state.json en el repo

# Evita que dos corridas se pisen al escribir el archivo de estado.
concurrency:
  group: breaking-alerts
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar noticias de alto impacto
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python breaking.py

      - name: Guardar estado (evitar alertas repetidas)
        continue-on-error: true   # guardar el estado no es critico: nunca debe tumbar el workflow
        run: |
          if [ -n "$(git status --porcelain breaking_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add breaking_state.json
            git commit -m "Actualizar estado de alertas [skip ci]"
            # Reintenta incorporando cambios remotos antes de subir (evita conflictos).
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push falló, reintento $i..."
              sleep 3
            done || echo "No se pudo guardar el estado (no crítico); se seguirá."
          else
            echo "Sin cambios en el estado; nada que guardar."
          fi
