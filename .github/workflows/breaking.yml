name: Alertas de alto impacto

on:
  # El disparo puntual lo hace un servicio externo (cron-job.org) que llama a
  # GitHub via workflow_dispatch cada hora. Ya no se usa "schedule" de GitHub.
  workflow_dispatch:

permissions:
  contents: write           # necesario para guardar breaking_state.json en el repo

# Evita que dos corridas se pisen al escribir el archivo de estado.
concurrency:
  group: breaking-alerts
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # backstop: ninguna corrida debe tardar mas
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar noticias de alto impacto
        timeout-minutes: 4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python breaking.py

      - name: Guardar estado (evitar alertas repetidas)
        continue-on-error: true   # guardar el estado no es critico: nunca debe tumbar el workflow
        timeout-minutes: 2        # si git se cuelga, se corta rapido (no 15 min)
        env:
          GIT_TERMINAL_PROMPT: "0"  # git nunca se cuelga pidiendo credenciales por consola
        run: |
          if [ -n "$(git status --porcelain breaking_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add breaking_state.json
            git commit -m "Actualizar estado de alertas [skip ci]"
            git pull --rebase --autostash origin main || git rebase --abort 2>/dev/null || true
            git push origin main || echo "No se pudo guardar el estado (no crítico); se reintenta luego."
          else
            echo "Sin cambios en el estado; nada que guardar."
          fi
